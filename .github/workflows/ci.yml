name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python quality gate
        run: make check

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/portfolio fmt -check -recursive

      - name: Validate Terraform without a backend
        run: |
          terraform -chdir=infrastructure/portfolio init -backend=false
          terraform -chdir=infrastructure/portfolio validate

      - name: Build the production container
        run: |
          docker build \
            --platform linux/amd64 \
            -f Dockerfile.api \
            -t sec-filing-agentic-qa-api:ci \
            .
